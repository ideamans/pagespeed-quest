name: Testing & Publish
on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Install modules
        run: yarn install
      - name: Building & Testing
        run: yarn test

  publish:
    runs-on: ubuntu-latest
    needs: testing
    # Publishing is driven by tags, not by pushes to main, so that merging a
    # branch never releases by itself. Tag with `v<package.json version>`.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify the tag matches package.json and the plugin manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./plugins/pagespeed-quest/.claude-plugin/plugin.json').version")
          echo "tag=$tag package.json=$pkg plugin.json=$plugin"
          test "$tag" = "$pkg" || { echo "::error::tag $tag does not match package.json $pkg"; exit 1; }
          test "$tag" = "$plugin" || { echo "::error::tag $tag does not match plugin.json $plugin"; exit 1; }
      - name: Install modules
        run: yarn install
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
