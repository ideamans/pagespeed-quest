# npm への公開（Trusted Publishing）
#
# `v*` のタグを push すると、テストとビルドのあと npm にそのまま公開する（承認待ちにしない）。
# 認証は GitHub Actions の OIDC で、NPM_TOKEN などのシークレットは使わない。
# npmjs.com のパッケージ設定で、このリポジトリのこのファイル（publish.yml）を
# Trusted Publisher（権限は publish）に登録してある前提。provenance は自動で付く。
#
# リリース: package.json の version を上げてコミット →
#   git tag vX.Y.Z && git push origin vX.Y.Z
# 既に npm にある版なら何もしない。タグを打ち直さずに出し直すときは workflow_dispatch で
# 対象のブランチを選んで起動する（package.json の版を公開する）。
# PR では、このファイルを変えたときだけ公開せずに中身（npm pack --dry-run）を確かめる。
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # registry-url は付けない。OIDC では要らず、付けると .npmrc に ${NODE_AUTH_TOKEN} を参照する
      # 設定が書かれて、yarn v1 などがその置換で落ちる
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Trusted Publishing には npm 11.5.1 以上が要る（yarn のリポジトリでも公開は npm で行う）
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check the tag and the registry
        id: check
        run: |
          set -euo pipefail
          skip=true
          for dir in .; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::タグ $GITHUB_REF_NAME が $dir/package.json の version（$version）と一致しない"
              exit 1
            fi
          plugin=$(node -p "require('./plugins/pagespeed-quest/.claude-plugin/plugin.json').version")
          if [ "$plugin" != "$version" ]; then
            echo "::error::plugins/pagespeed-quest/.claude-plugin/plugin.json の version（$plugin）が package.json（$version）と一致しない"
            exit 1
          fi
            published=$(npm view "$name@$version" version 2>/dev/null || true)
            if [ -n "$published" ]; then
              echo "::notice::$name@$version は npm にある"
            else
              echo "$name@$version を公開する"
              skip=false
            fi
          done
          # PR では版が npm にあっても、ビルドと中身の確認はする
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            skip=false
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: yarn install --frozen-lockfile

      - name: Build and test
        if: steps.check.outputs.skip != 'true'
        run: yarn test

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: yarn build

      - name: Show the package contents
        if: steps.check.outputs.skip != 'true'
        run: npm pack --dry-run --ignore-scripts

      # テストとビルドは上で済ませたので、prepublishOnly などのスクリプトは走らせない。
      # プレリリース（1.2.0-beta.0 など）は latest にせず、その識別子（beta）の dist-tag で出す
      - name: Publish
        if: steps.check.outputs.skip != 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          disttag=latest
          case "$version" in *-*) pre="${version#*-}"; disttag="${pre%%.*}" ;; esac
          npm publish --access public --ignore-scripts --tag "$disttag"
