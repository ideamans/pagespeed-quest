name: Testing & Publish
on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          registry-url: 'https://registry.npmjs.org'
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Building & Testing
        run: yarn test

  publish:
    runs-on: ubuntu-latest
    needs: testing
    # Publishing is driven by tags, not by pushes to main, so that merging a
    # branch never releases by itself. Tag with `v<package.json version>`.
    if: startsWith(github.ref, 'refs/tags/v')
    # npm の Trusted Publishing（OIDC）で公開待ちに積む（staged publish）。トークンの secret は使わない。
    # npmjs.com のパッケージ設定で、このリポジトリの publish.yml を Trusted Publisher に登録してある前提
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: yarn
          registry-url: 'https://registry.npmjs.org'
      - name: Verify the tag matches package.json and the plugin manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./plugins/pagespeed-quest/.claude-plugin/plugin.json').version")
          echo "tag=$tag package.json=$pkg plugin.json=$plugin"
          test "$tag" = "$pkg" || { echo "::error::tag $tag does not match package.json $pkg"; exit 1; }
          test "$tag" = "$plugin" || { echo "::error::tag $tag does not match plugin.json $plugin"; exit 1; }
      - name: Install modules
        run: yarn install --frozen-lockfile
      # Trusted Publishing には npm 11.5.1 以上が要る
      - name: Update npm
        run: npm install -g npm@latest
      # Trusted Publisher の権限は「stage publish」。ここでは公開待ちに積むだけで、
      # npmjs.com で 2FA つきの承認をすると公開される（npm stage approve <id> でも可）
      - name: Stage the release on npm
        run: npm stage publish . --access public
